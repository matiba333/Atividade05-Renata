<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade - HTML e CSS: Formulário</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #333;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: #fff;
            color: #333;
            padding: 2px;
            border: 1px solid #000;
            position: relative;
            margin-bottom: 20px;
        }

        .container::before {
            content: "";
            position: absolute;
            top: -10px;
            left: -10px;
            width: 20px;
            height: 20px;
            background: #fff;
            border: 1px solid #000;
            z-index: 1;
        }

        h1 {
            color: #e67e22;
            background-color: white;
            padding: 15px 25px;
            border: 1px solid #000;
            font-size: 24px;
            text-align: left;
        }

        form {
            background-color: #2c2c2c;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
        }

        .campo {
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
        }

        label {
            margin-bottom: 8px;
            font-weight: bold;
            color: #ddd;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"],
        input[type="date"],
        select,
        textarea {
            padding: 12px 15px;
            background-color: #444;
            border: 2px solid #555;
            color: white;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        input[type="file"] {
            color: #ddd;
            padding: 5px 0;
        }

        input[type="date"]::-webkit-calendar-picker-indicator {
            filter: invert(1);
            cursor: pointer;
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: #e67e22;
            box-shadow: 0 0 8px rgba(230, 126, 34, 0.6);
            background-color: #505050;
        }

        .opcoes-grupo {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            padding: 10px 0;
        }

        .opcao-item {
            display: flex;
            align-items: center;
            cursor: pointer;
        }

        .opcao-item input {
            margin-right: 8px;
            cursor: pointer;
            accent-color: #e67e22;
            transform: scale(1.2);
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        .botoes-container {
            display: flex;
            gap: 15px;
            margin-top: 25px;
        }

        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.1s;
        }

        .btn-enviar {
            background-color: #27ae60;
            color: white;
        }

        .btn-limpar {
            background-color: #c0392b;
            color: white;
        }

        .btn-enviar:hover {
            background-color: #2ecc71;
        }

        .btn-limpar:hover {
            background-color: #e74c3c;
        }

        button:active {
            transform: scale(0.98);
        }

        @media (max-width: 480px) {
            form {
                padding: 15px;
            }

            h1 {
                font-size: 20px;
                padding: 10px 15px;
            }

            .opcoes-grupo {
                flex-direction: column;
                gap: 10px;
            }

            .botoes-container {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>

    <div class="wrapper" style="display:flex; flex-direction:column; align-items:center; width: 100%;">
        <div class="container">
            <h1>Atividade - HTML e CSS: Formulário</h1>
        </div>

        <form action="#" method="post" enctype="multipart/form-data">
            
            <div class="campo">
                <label for="nome">Nome:</label>
                <input type="text" id="nome" name="nome" placeholder="Digite seu nome completo" required>
            </div>

            <div class="campo">
                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email" placeholder="exemplo@email.com" required>
            </div>

            <div class="campo">
                <label for="senha">Senha:</label>
                <input type="password" id="senha" name="senha" placeholder="Mínimo 8 caracteres" required minlength="8">
            </div>

            <div class="campo">
                <label for="data_nasc">Data de nascimento:</label>
                <input type="date" id="data_nasc" name="data_nasc" required>
            </div>

            <div class="campo">
                <label for="curso">Curso:</label>
                <select id="curso" name="curso" required>
                    <option value="" disabled selected>Selecione um curso</option>
                    <option value="ads">Análise e Desenv. de Sistemas</option>
                    <option value="mkt">Marketing Digital</option>
                    <option value="design">Design Gráfico</option>
                    <option value="gestao">Gestão de TI</option>
                </select>
            </div>

            <div class="campo">
                <label>Sexo:</label>
                <div class="opcoes-grupo">
                    <label class="opcao-item">
                        <input type="radio" name="sexo" value="masculino" required> Masculino
                    </label>
                    <label class="opcao-item">
                        <input type="radio" name="sexo" value="feminino"> Feminino
                    </label>
                    <label class="opcao-item">
                        <input type="radio" name="sexo" value="outro"> Outro
                    </label>
                    <label class="opcao-item">
                        <input type="radio" name="sexo" value="pnd"> Prefiro não declarar
                    </label>
                </div>
            </div>

            <div class="campo">
                <label>Interesses:</label>
                <div class="opcoes-grupo">
                    <label class="opcao-item">
                        <input type="checkbox" name="interesses" value="tecnologia"> Tecnologia
                    </label>
                    <label class="opcao-item">
                        <input type="checkbox" name="interesses" value="programacao"> Programação
                    </label>
                    <label class="opcao-item">
                        <input type="checkbox" name="interesses" value="negocios"> Negócios
                    </label>
                    <label class="opcao-item">
                        <input type="checkbox" name="interesses" value="arte"> Arte
                    </label>
                </div>
            </div>

            <div class="campo">
                <label for="comentarios">Comentários:</label>
                <textarea id="comentarios" name="comentarios" placeholder="Deixe sua mensagem opcional..."></textarea>
            </div>

            <div class="campo">
                <label for="foto">Upload de foto:</label>
                <input type="file" id="foto" name="foto" accept="image/*">
            </div>

            <div class="botoes-container">
                <button type="reset" class="btn-limpar">Limpar</button>
                <button type="submit" class="btn-enviar">Enviar Cadastro</button>
            </div>

        </form>
    </div>

</body>
</html>
